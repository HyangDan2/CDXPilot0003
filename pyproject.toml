[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kosim"
version = "0.1.0"
description = "KOSPI NXT signal sweep simulator with Telegram and stateless LLM analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "CDXPilot0003"}]
dependencies = [
  "PySide6>=6.7",
  "PyYAML>=6.0",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kosim = "kosim.app:main"
kosim-scheduler = "kosim.scheduler:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
